[package]
name = "transcriber-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"

[dependencies]
anyhow = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.24"

[lib]
name = "transcriber_api"
path = "src/lib.rs"

[[bin]]
name = "transcriber-server"
path = "src/bin/transcriber-server.rs"

[[bin]]
name = "transcriber-client"
path = "src/bin/transcriber-client.rs"
